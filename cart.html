<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shopping Cart - PINAKI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <nav class="navbar">
      <a href="index.html" class="logo">PINAKI</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="products.html">All Products</a>
        <a href="cart.html" class="cart-btn">🛒 Cart (<span id="cart-count">0</span>)</a>
      </div>
    </nav>
  </header>

  <main class="container">
    <h2 style="text-align: center; margin-bottom: 2rem;">Your Cart</h2>
    <div id="cart-items" style="max-width: 600px; margin: 0 auto;"></div>
    <div id="cart-total" style="max-width: 600px; margin: 1.5rem auto; text-align: right; font-size: 1.3rem; font-weight: bold;"></div>
    <div style="text-align: center; margin-top: 2rem;">
      <a href="checkout.html" class="btn-main" id="checkout-btn" style="display: none;">Proceed to Checkout</a>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 PINAKI Homemade Products. All rights reserved.</p>
  </footer>

  <script>
    function renderCart() {
      let cart = JSON.parse(localStorage.getItem('pinaki_cart')) || [];
      document.getElementById('cart-count').innerText = cart.length;
      
      const container = document.getElementById('cart-items');
      const totalDiv = document.getElementById('cart-total');
      const checkoutBtn = document.getElementById('checkout-btn');

      if (cart.length === 0) {
        container.innerHTML = "<p style='text-align:center;'>Your cart is empty.</p>";
        totalDiv.innerHTML = "";
        checkoutBtn.style.display = "none";
        return;
      }

      container.innerHTML = "";
      let total = 0;

      cart.forEach((item, index) => {
        total += item.price;
        container.innerHTML += `
          <div style="background: white; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center;">
            <div>
              <strong>${item.name}</strong> (${item.weight})
              <div style="color: var(--primary); font-weight: bold;">₹${item.price}</div>
            </div>
            <button onclick="removeItem(${index})" style="background: red; color: white; border: none; padding: 0.3rem 0.8rem; border-radius: 5px; cursor: pointer;">Remove</button>
          </div>
        `;
      });

      totalDiv.innerText = `Total: ₹${total}`;
      checkoutBtn.style.display = "inline-block";
    }

    function removeItem(index) {
      let cart = JSON.parse(localStorage.getItem('pinaki_cart')) || [];
      cart.splice(index, 1);
      localStorage.setItem('pinaki_cart', JSON.stringify(cart));
      renderCart();
    }

    renderCart();
  </script>
</body>
</html>
