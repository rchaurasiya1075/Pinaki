<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - PINAKI</title>
  <style>
    :root { var(--primary): #d97706; }
    body { font-family: sans-serif; background: #f8fafc; margin: 0; padding: 0; }
    header { background: white; padding: 1rem 2rem; border-bottom: 1px solid #e2e8f0; }
    .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    .order-card { background: white; padding: 1.2rem; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 1rem; }
    .badge { padding: 0.3rem 0.6rem; border-radius: 4px; font-weight: bold; background: #fef3c7; color: #b45309; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" style="font-size: 1.5rem; font-weight: bold; color: #d97706; text-decoration: none;">PINAKI</a>
  </header>

  <main class="container">
    <h2>Aapke Order Status</h2>
    <div id="orders-list" style="margin-top: 1.5rem;">Loading orders...</div>
  </main>

  <script type="module">
    import { db, auth } from './firebase-config.js';
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    onAuthStateChanged(auth, async (user) => {
      const container = document.getElementById('orders-list');
      if (!user) {
        container.innerHTML = "<p>Orders dekhne ke liye pehle <a href='auth.html'>Login</a> karein.</p>";
        return;
      }

      try {
        const q = query(collection(db, "orders"), where("userId", "==", user.uid));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          container.innerHTML = "<p>Aapne abhi tak koi order nahi kiya hai.</p>";
          return;
        }

        container.innerHTML = '';
        querySnapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const card = document.createElement('div');
          card.className = 'order-card';
          card.innerHTML = `
            <div>
              <strong>Order ID: ${docSnap.id}</strong>
              <p>Total: ₹${data.totalAmount} | Items: ${data.items.length}</p>
              <p>Status: <span class="badge">${data.orderStatus}</span></p>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        container.innerHTML = "<p>Error: " + err.message + "</p>";
      }
    });
  </script>
</body>
</html>
