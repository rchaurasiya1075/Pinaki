<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - PINAKI</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .order-card {
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      padding: 1.2rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }
    .order-header {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #eee;
      padding-bottom: 0.8rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      color: #555;
    }
    .order-item-row {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-bottom: 0.8rem;
    }
    .order-item-img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #eee;
    }
    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .status-delivered { background: #d1fae5; color: #047857; }
    .status-processing { background: #fef3c7; color: #b45309; }
    .status-shipped { background: #dbeafe; color: #1d4ed8; }
    .order-footer {
      border-top: 1px dashed #ddd;
      padding-top: 0.8rem;
      margin-top: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <header>
    <nav class="navbar">
      <a href="index.html" class="logo">PINAKI</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html" class="cart-btn">🛒 Cart</a>
        <button id="logout-btn" style="background:#ef4444; color:white; border:none; padding:0.4rem 0.8rem; border-radius:6px; cursor:pointer;">Logout</button>
      </div>
    </nav>
  </header>

  <main class="container" style="max-width: 800px;">
    <h2 style="margin-bottom: 1.5rem;">My Orders & Purchase History</h2>
    <div id="user-info" style="margin-bottom: 1rem; color: var(--gray);"></div>

    <div id="orders-container">
      <p style="text-align: center; color: var(--gray);">Order history load ho rahi hai...</p>
    </div>
  </main>

  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "auth.html";
        return;
      }

      document.getElementById('user-info').innerText = `Logged in as: ${user.email}`;

      try {
        const q = query(collection(db, "orders"), where("userId", "==", user.uid));
        const querySnapshot = await getDocs(q);
        const container = document.getElementById('orders-container');

        if (querySnapshot.empty) {
          container.innerHTML = `
            <div style="text-align:center; padding: 3rem; background:white; border-radius:8px;">
              <h3>Koi order nahi mila</h3>
              <p style="color:var(--gray); margin-top:0.5rem;">Aapne abhi tak koi order nahi diya hai.</p>
              <br>
              <a href="products.html" class="btn-main">Shopping Karein</a>
            </div>`;
          return;
        }

        let ordersList = [];
        querySnapshot.forEach(doc => {
          ordersList.push({ id: doc.id, ...doc.data() });
        });

        // Latest order pehle dikhane ke liye sort
        ordersList.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

        container.innerHTML = "";
        ordersList.forEach(order => {
          const dateStr = new Date(order.timestamp).toLocaleString('hi-IN', {
            day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
          });

          let statusClass = "status-processing";
          if(order.status === "Delivered") statusClass = "status-delivered";
          if(order.status === "Shipped") statusClass = "status-shipped";

          let itemsHtml = order.items.map(item => `
            <div class="order-item-row">
              <img src="${item.image || 'https://via.placeholder.com/70'}" class="order-item-img" alt="${item.name}">
              <div>
                <strong>${item.name}</strong>
                <div style="font-size:0.85rem; color:#666;">Quantity: 1 | Price: ₹${item.price}</div>
              </div>
            </div>
          `).join('');

          container.innerHTML += `
            <div class="order-card">
              <div class="order-header">
                <div>
                  <strong>ORDER PLACED:</strong> ${dateStr}<br>
                  <small>Order ID: #${order.id}</small>
                </div>
                <div>
                  <span class="status-badge ${statusClass}">${order.status || 'Processing'}</span>
                </div>
              </div>
              
              <div class="order-items-body">
                ${itemsHtml}
              </div>

              <div class="order-footer">
                <div>
                  <strong>Delivery Address:</strong> ${order.deliveryAddress || 'N/A'}
                </div>
                <div style="text-align:right;">
                  <span style="font-size:0.9rem; color:#555;">Total Paid:</span>
                  <div style="font-size:1.2rem; font-weight:bold; color:var(--primary);">₹${order.totalAmount}</div>
                  <small style="color:#10b981;">● ${order.paymentStatus || 'Paid'}</small>
                </div>
              </div>
            </div>
          `;
        });

      } catch (err) {
        console.error(err);
        document.getElementById('orders-container').innerHTML = "<p style='color:red;'>Order history load karne me dikkat aayi.</p>";
      }
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
      signOut(auth).then(() => window.location.href = "auth.html");
    });
  </script>
</body>
</html>
