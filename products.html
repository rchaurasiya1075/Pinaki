<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop - PINAKI</title>
  <style>
    :root { var(--primary): #d97706; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #f8fafc; color: #1e293b; }
    header { background: white; padding: 1rem 2rem; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; }
    .logo { font-size: 1.5rem; font-weight: bold; color: #d97706; text-decoration: none; }
    .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1.5rem; }
    .card { background: white; border-radius: 8px; border: 1px solid #e2e8f0; overflow: hidden; display: flex; flex-direction: column; }
    .card img { width: 100%; height: 200px; object-fit: cover; }
    .info { padding: 1rem; display: flex; flex-direction: column; flex: 1; }
    .price { font-size: 1.2rem; font-weight: bold; color: #d97706; margin: 0.5rem 0; }
    .mrp { text-decoration: line-through; color: #94a3b8; font-size: 0.9rem; }
    .off { color: #16a34a; font-size: 0.85rem; font-weight: bold; margin-left: 0.3rem; }
    .btn-cart { width: 100%; padding: 0.6rem; background: #d97706; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: auto; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">PINAKI</a>
    <a href="cart.html" style="text-decoration: none; font-weight: bold; color: #1e293b;">🛒 Cart (<span id="cart-cnt">0</span>)</a>
  </header>

  <main class="container">
    <h2>All Products</h2>
    <br>
    <div class="grid" id="customer-grid">Loading...</div>
  </main>

  <script type="module">
    import { db } from './firebase-config.js';
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    async function displayProducts() {
      const grid = document.getElementById('customer-grid');
      const snap = await getDocs(collection(db, "products"));
      grid.innerHTML = '';
      
      snap.forEach(docSnap => {
        const item = docSnap.data();
        const discount = item.mrp ? Math.round(((item.mrp - item.price) / item.mrp) * 100) : 0;

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${item.imageUrl}">
          <div class="info">
            <h3>${item.title}</h3>
            <p style="font-size: 0.85rem; color: #64748b; margin: 0.3rem 0;">${item.description || ''}</p>
            <div class="price">
              ₹${item.price} <span class="mrp">₹${item.mrp || ''}</span> <span class="off">${discount}% OFF</span>
            </div>
            <button class="btn-cart" onclick="addToCart('${docSnap.id}', '${item.title}', ${item.price}, '${item.imageUrl}')">Add to Cart</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    displayProducts();

    window.addToCart = function(id, title, price, imageUrl) {
      let cart = JSON.parse(localStorage.getItem('pinaki_cart')) || [];
      cart.push({ id, title, price, imageUrl });
      localStorage.setItem('pinaki_cart', JSON.stringify(cart));
      document.getElementById('cart-cnt').innerText = cart.length;
      alert(`${title} cart me add ho gaya!`);
    };
  </script>
</body>
</html>
