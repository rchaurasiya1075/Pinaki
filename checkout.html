<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout - PINAKI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <nav class="navbar">
      <a href="index.html" class="logo">PINAKI</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="products.html">All Products</a>
        <a href="cart.html" class="cart-btn">🛒 Cart (<span id="cart-count">0</span>)</a>
      </div>
    </nav>
  </header>

  <main class="container">
    <div style="background: white; padding: 2rem; border-radius: 12px; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
      <h2 style="text-align: center; margin-bottom: 1.5rem;">Delivery Details</h2>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="cust-name" placeholder="Enter your name" required>
      </div>
      <div class="form-group">
        <label>Mobile Number</label>
        <input type="tel" id="cust-phone" placeholder="Enter phone number" required>
      </div>
      <div class="form-group">
        <label>Delivery Address</label>
        <textarea id="cust-address" placeholder="Enter full address with pincode" required></textarea>
      </div>
      <button class="btn-main" style="width: 100%; background: #25d366;" onclick="sendWhatsAppOrder()">Confirm Order via WhatsApp</button>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 PINAKI Homemade Products. All rights reserved.</p>
  </footer>

  <script>
    function updateCartCount() {
      let cart = JSON.parse(localStorage.getItem('pinaki_cart')) || [];
      document.getElementById('cart-count').innerText = cart.length;
    }

    function sendWhatsAppOrder() {
      const name = document.getElementById('cust-name').value;
      const phone = document.getElementById('cust-phone').value;
      const address = document.getElementById('cust-address').value;
      let cart = JSON.parse(localStorage.getItem('pinaki_cart')) || [];

      if (!name || !phone || !address) {
        alert("Please fill all contact details.");
        return;
      }

      if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
      }

      let orderItems = cart.map(item => `- ${item.name} (₹${item.price})`).join("%0A");
      let total = cart.reduce((sum, item) => sum + item.price, 0);

      let text = `*NEW ORDER - PINAKI FOODS*%0A%0A*Name:* ${name}%0A*Phone:* ${phone}%0A*Address:* ${address}%0A%0A*Items:*%0A${orderItems}%0A%0A*Total Amount:* ₹${total}`;
      
      // Apne WhatsApp number se replace karein
      window.open(`https://wa.me/919876543210?text=${text}`, '_blank');
      
      localStorage.removeItem('pinaki_cart');
      alert("Order placed successfully!");
      window.location.href = "index.html";
    }

    updateCartCount();
  </script>
</body>
</html>
