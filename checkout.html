<!-- Include Razorpay SDK -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script type="module">
  import { db, auth } from './firebase-config.js';
  import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  function payOnline(amount, orderDetails) {
    var options = {
      "key": "YOUR_RAZORPAY_KEY_ID", // Enter Key ID generated from Razorpay Dashboard
      "amount": amount * 100, // Amount in paise
      "currency": "INR",
      "name": "PINAKI Foods",
      "description": "Payment for Homemade Products",
      "handler": async function (response) {
        // Save Order to Firestore after successful payment
        await addDoc(collection(db, "orders"), {
          userId: auth.currentUser ? auth.currentUser.uid : "guest",
          items: orderDetails.items,
          totalAmount: amount,
          paymentId: response.razorpay_payment_id,
          paymentStatus: "SUCCESS",
          status: "Processing",
          timestamp: new Date().toISOString()
        });

        alert("Payment Successful! Order ID Saved.");
        window.location.href = "user-panel.html";
      },
      "prefill": {
        "name": orderDetails.customerName,
        "contact": orderDetails.phone
      },
      "theme": { "color": "#d97706" }
    };
    var rzp1 = new Razorpay(options);
    rzp1.open();
  }
</script>
